name: Pipeline

# Runs on every push to main: a direct push or a merged pull request
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # Exact install from package-lock.json
      - run: npm ci

      # The generated Prisma client is gitignored, so build it before typechecking.
      # Generating only reads the schema; this URL is never connected to.
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db

      - run: npm run typecheck
      - run: npm run build

  build:
    # Only runs if "check" passed
    needs: check
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Tag the image with the commit, so every deploy is traceable
      - id: image
        run: echo "name=${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - run: |
          docker build -t "${{ steps.image.outputs.name }}" .
          docker push "${{ steps.image.outputs.name }}"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run the deploy script on the instance
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          set -e
          # Registry hostname is everything before the first "/"
          REGISTRY="${IMAGE%%/*}"

          SCRIPT=$(cat <<EOF
          set -e
          DB_URL=\$(aws ssm get-parameter --name /express-server/DATABASE_URL --with-decryption --query Parameter.Value --output text --region ${{ vars.AWS_REGION }})
          aws ecr get-login-password --region ${{ vars.AWS_REGION }} | docker login --username AWS --password-stdin $REGISTRY
          docker pull $IMAGE
          # Apply pending migrations before the new code starts using the database
          docker run --rm -e DATABASE_URL="\$DB_URL" $IMAGE npx prisma migrate deploy
          docker rm -f api || true
          docker run -d --name api --restart unless-stopped -p 127.0.0.1:3000:3000 -e TRUST_PROXY=1 -e DATABASE_URL="\$DB_URL" -e DATABASE_SSL=true $IMAGE
          sleep 3
          curl -fsS localhost/health
          curl -fsS localhost/ready
          # Free disk space: unused images older than a day (never one in use)
          docker image prune -af --filter "until=24h"
          EOF
          )

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${{ github.sha }}" \
            --parameters "$(jq -n --arg s "$SCRIPT" '{commands: [$s]}')" \
            --query Command.CommandId --output text)

          echo "SSM command: $COMMAND_ID"
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" || true

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output text

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query Status --output text)

          echo "Deploy status: $STATUS"
          [ "$STATUS" = "Success" ]
