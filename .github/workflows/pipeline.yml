name: Pipeline

# Runs on every push to main: a direct push or a merged pull request
on:
  push:
    branches: [main]

permissions:
  contents: read
  # Required to request the OIDC token used to log in to AWS
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # Exact install from package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  build:
    # Only runs if "check" passed
    needs: check
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Tag the image with the commit, so every deploy is traceable
      - id: image
        run: echo "name=${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - run: |
          docker build -t "${{ steps.image.outputs.name }}" .
          docker push "${{ steps.image.outputs.name }}"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run the deploy script on the instance
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          set -e
          # Registry hostname is everything before the first "/"
          REGISTRY="${IMAGE%%/*}"

          SCRIPT=$(cat <<EOF
          set -e
          aws ecr get-login-password --region ${{ vars.AWS_REGION }} | docker login --username AWS --password-stdin $REGISTRY
          docker pull $IMAGE
          docker rm -f api || true
          docker run -d --name api --restart unless-stopped -p 127.0.0.1:3000:3000 -e TRUST_PROXY=1 $IMAGE
          sleep 3
          curl -fsS localhost/health
          docker image prune -f
          EOF
          )

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${{ github.sha }}" \
            --parameters "$(jq -n --arg s "$SCRIPT" '{commands: [$s]}')" \
            --query Command.CommandId --output text)

          echo "SSM command: $COMMAND_ID"
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" || true

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output text

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query Status --output text)

          echo "Deploy status: $STATUS"
          [ "$STATUS" = "Success" ]
